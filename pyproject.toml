[project]
name = "oligos-agents"
version = "0.1.0"
description = "Precision Oligos data-integrity agent platform: a Well-Architected, multi-agent QC workflow for oligonucleotide synthesis."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic-ai-slim[bedrock]>=0.0.36",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "boto3>=1.34",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.8",
    "authlib>=1.3",
    "itsdangerous>=2.2",
    "aws-lambda-powertools>=2.40",
    "mcp>=1.28.1",
]

[project.optional-dependencies]
tracing = [
    "aws-xray-sdk>=2.13",
    "logfire>=4.37.0",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
oligos-agents = "oligos_agents.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oligos_agents"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "W"]
# B008: FastAPI's Depends()/Header() in argument defaults is the idiomatic pattern.
# N818: "*NotConfigured"/"*Denied" exception names read better without an Error suffix.
ignore = ["B008", "N818"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
